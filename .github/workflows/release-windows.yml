name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Acknowledge source
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://acknowledge-q9yyk4-preview.freebuff.page/desktop/acknowledge-source.zip' -OutFile source.zip
          Expand-Archive -Path source.zip -DestinationPath . -Force
          Remove-Item source.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the FFmpeg core
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path public/ffmpeg | Out-Null
          $files = @{
            'ffmpeg-core.js'   = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js'
            'ffmpeg-core.wasm' = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm'
            'worker.js'        = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/worker.js'
            'const.js'         = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/const.js'
            'errors.js'        = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/errors.js'
          }
          foreach ($name in $files.Keys) {
            Invoke-WebRequest -Uri $files[$name] -OutFile (Join-Path 'public/ffmpeg' $name)
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $lines = Get-Content 'CHANGELOG.md'
          $section = @()
          $found = $false
          foreach ($line in $lines) {
            if ($line -match '^##\s+') {
              if ($found) { break }
              if ($line -match ('^##\s+' + [regex]::Escape($version) + '\s*$')) { $found = $true; continue }
            } elseif ($found) {
              $section += $line
            }
          }
          $body = (($section -join "`n").Trim())
          if (-not $body) { $body = "Windows build of Acknowledge v$version." }
          $body += "`n`nExisting installations can update from Settings → Desktop updates.`n`nThis build is not code-signed, so Windows SmartScreen may ask you to confirm before running it."
          "body<<NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Acknowledge v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
